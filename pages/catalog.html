<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Catalog | DECKER</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/catalog.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
  </script>
  <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="catalog-viewer-section">
    
    <div id="loadingState">
      <div class="spinner"></div>
      <p>Loading Catalog...</p>
    </div>

    <div class="book-controls top">
      <h2 class="book-title">Decker Product Catalog 2025</h2>
      <div class="control-group">
        <a href="../assets/documents/DECK-ER CATOLOG.pdf" download class="btn-download">
          <i class="fas fa-download"></i> <span class="hide-mobile">Download PDF</span>
        </a>
      </div>
    </div>

    <div class="book-stage">
      <button id="btnPrev" class="page-nav prev"><i class="fas fa-chevron-left"></i></button>
      
      <div id="book">
        </div>

      <button id="btnNext" class="page-nav next"><i class="fas fa-chevron-right"></i></button>
    </div>

    <div class="book-controls bottom">
      <span id="pageCounter">Initializing...</span>
    </div>

  </main>

  <div id="footer-placeholder"></div>

  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/catalog.js"></script>
</body>
</html>
