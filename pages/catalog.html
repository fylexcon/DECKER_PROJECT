<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Digital Catalog | DECKER</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/catalog.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    </script>
    <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <section class="catalog-showcase">
      <div class="container">
        <div class="showcase-wrapper">
          <div class="showcase-content">
            <span class="badge-new">NEW COLLECTION</span>
            <h1>Explore Our 2025<br />Digital Catalog</h1>
            <p>
              Discover the future of outdoor living with our interactive
              flipbook experience.
            </p>

            <button id="openBookBtn" class="btn-primary-large">
              <i class="fas fa-book-open"></i> READ CATALOG
            </button>

            <div class="download-option">
              <a href="../assets/documents/DECK-ER CATOLOG.pdf" download>
                Or download PDF file <i class="fas fa-arrow-right"></i>
              </a>
            </div>
          </div>

          <div class="showcase-image">
            <img
              src="../assets/images/get_inspired/12.png"
              alt="Decker Catalog Cover"
              class="floating-cover"
            />
          </div>
        </div>
      </div>
    </section>

    <div id="catalogModal" class="catalog-overlay">
      <div class="viewer-top-bar">
        <div class="brand">DECKER VIEWER</div>
        <button id="closeBookBtn" class="btn-close-viewer">
          <i class="fas fa-times"></i> CLOSE
        </button>
      </div>

      <div class="viewer-body">
        <div id="loadingBar">
          <div class="spinner"></div>
          <span>Loading...</span>
        </div>

        <div id="book"></div>

        <button id="btnPrev" class="nav-arrow left">
          <i class="fas fa-chevron-left"></i>
        </button>
        <button id="btnNext" class="nav-arrow right">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>

      <div class="viewer-bottom-bar">
        <span id="pageCounter">Page 1</span>
      </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/catalog.js"></script>
  </body>
</html>
