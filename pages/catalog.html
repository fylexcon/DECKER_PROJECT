<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Digital Catalog | DECKER</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/catalog.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    </script>
    <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>
  </head>
  <body>
    <main class="fullscreen-viewer">
      <div class="top-bar-controls">
        <a href="../index.html" class="btn-exit">
          <i class="fas fa-arrow-left"></i>
          <span class="hide-mobile">Back to Home</span>
        </a>

        <div class="title-area">DECKER CATALOG 2025</div>

        <a
          href="../assets/documents/DECK-ER CATOLOG.pdf"
          download
          class="btn-download-icon"
        >
          <i class="fas fa-download"></i>
        </a>
      </div>

      <div id="loadingState">
        <div class="spinner"></div>
        <p>Loading Catalog...</p>
      </div>

      <div class="book-stage">
        <div id="book"></div>
      </div>

      <button id="btnPrev" class="nav-arrow left">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button id="btnNext" class="nav-arrow right">
        <i class="fas fa-chevron-right"></i>
      </button>

      <div class="bottom-bar-controls">
        <div class="page-counter" id="pageCounter">Loading...</div>

        <div class="zoom-tools">
          <button id="btnZoomOut"><i class="fas fa-minus"></i></button>
          <button id="btnZoomIn"><i class="fas fa-plus"></i></button>
        </div>
      </div>
    </main>

    <script src="../assets/js/catalog.js"></script>
  </body>
</html>
